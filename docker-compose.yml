name: frontpage

x-database-url: &database-url postgres://frontpage:frontpage@db:5432/frontpage

services:
    db:
        image: postgres:17-alpine
        environment:
            POSTGRES_USER: frontpage
            POSTGRES_PASSWORD: frontpage
            POSTGRES_DB: frontpage
        ports:
            - '5432:5432'
        volumes:
            - db-data:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U frontpage -d frontpage']
            interval: 2s
            timeout: 5s
            retries: 20

    migrate:
        build:
            context: .
            dockerfile: backend/Dockerfile.local
        command: ['bun', '--no-env-file', 'x', 'drizzle-kit', 'migrate']
        environment:
            DATABASE_URL: *database-url
            DATABASE_URL_UNPOOLED: *database-url
        volumes:
            - ./backend:/app/backend
            - ./packages:/app/packages
            - /app/backend/node_modules
        depends_on:
            db:
                condition: service_healthy
        restart: 'no'

    backend:
        build:
            context: .
            dockerfile: backend/Dockerfile.local
        environment:
            NODE_ENV: development
            PORT: 4000
            WEB_ORIGIN: http://localhost:3000
            DATABASE_URL: *database-url
            DATABASE_URL_UNPOOLED: *database-url
            AUTH_URL: http://localhost:4000
        command: ['bun', '--no-env-file', '--watch', 'src/index.ts']
        volumes:
            - ./backend:/app/backend
            - ./packages:/app/packages
            - /app/backend/node_modules
        ports:
            - '4000:4000'
        depends_on:
            db:
                condition: service_healthy
            migrate:
                condition: service_completed_successfully
        healthcheck:
            test:
                - CMD
                - bun
                - -e
                - "fetch('http://localhost:4000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
            interval: 5s
            timeout: 5s
            retries: 10
        restart: unless-stopped

    frontend:
        build:
            context: .
            dockerfile: frontend/Dockerfile.local
        environment:
            API_URL: http://backend:4000
            NEXT_PUBLIC_SITE_URL: http://localhost:3000
        volumes:
            - ./frontend:/app/frontend
            - ./packages:/app/packages
            - /app/frontend/node_modules
            - /app/frontend/.next
        ports:
            - '3000:3000'
        depends_on:
            backend:
                condition: service_healthy
        restart: unless-stopped

volumes:
    db-data:
